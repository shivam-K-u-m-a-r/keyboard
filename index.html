<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Jersey+20&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="main">
    <div id="controls">
        <div id="volumeControl">
            <label for="volumeSlider">Volume:</label>
            <input type="range" min="0" max="1" step="0.01" value="0.5" id="volumeSlider">
            <span class="slider-value" id="volumeValue">50%</span>
        </div>

        <div id="pitchControl">
            <label for="pitchSlider">Pitch:</label>
            <input type="range" min="0.5" max="2" step="0.1" value="1.0" id="pitchSlider">
            <span class="slider-value" id="pitchValue">1.0x</span>
        </div>
    </div>

    <div id="container">

        <div class="first set ">
            <div class="white keys" data-key="w"></div>
            <div class="black a keys" data-key="a"></div>
            <div class="white keys" data-key="s"></div>
            <div class="black b keys" data-key="d"></div>     
            <div class="white keys" data-key="j"></div>
        </div>
        

        

        <div class="second set">
            <div class="white keys" data-key="k"></div>
            <div class="black a keys" data-key="l"></div>
            <div class="white keys" data-key="q"></div>
            <div class="black b keys" data-key="e"></div>     
            <div class="white keys" data-key="r"></div>
            <div class="black c keys" data-key="t"></div>
            <div class="white keys" data-key="u"></div>
        </div>


        <div class="third set">
            <div class="white keys" data-key="i"></div>
            <div class="black a keys" data-key="o"></div>
            <div class="white keys" data-key="p"></div>
            <div class="black b keys" data-key="f"></div>     
            <div class="white keys" data-key="g"></div>
        </div>


        <div class="fourth set">
            <div class="white keys" data-key="h"></div>
            <div class="black a keys" data-key="l"></div>
            <div class="white keys" data-key="["></div>
            <div class="black b keys" data-key=";"></div>
            <div class="white keys" data-key="b"></div>
            <div class="black c keys" data-key="n"></div>
            <div class="white keys" data-key="m"></div>
        </div>

    </div>
</div>


    <script src="script.js"></script>
</body>
</html>
